# atuin: Ctrl+R history search. Full reference: https://docs.atuin.sh/configuration/config/

# Local only - no sync server, no update checks.
auto_sync = false
update_check = false

# Look like the fzf pickers: compact, inline, below the prompt.
style = "compact"
inline_height = 20

# Enter puts the command on the line to edit, like fzf's Ctrl+R; Tab does too.
enter_accept = false

# Ctrl+R to cycle: all history -> this session -> this directory -> this host.
filter_mode = "global"
