"$schema" = 'https://starship.rs/config-schema.json'

# Segments use the Monokai Pro palette below. Plain text outside the segments
# (❯, command duration) uses the terminal's ANSI colors instead, so it stays
# readable on Ghostty's Monokai Pro Light background.

format = """
[](fg:mp_green)\
$directory\
[](fg:mp_green bg:mp_yellow)\
$git_branch\
$git_status\
[](fg:mp_yellow bg:mp_red)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:mp_red bg:mp_purple)\
$docker_context\
$kubernetes\
$aws\
[](fg:mp_purple bg:mp_gray)\
$shlvl\
$time\
[ ](fg:mp_gray)\
$fill\
$cmd_duration\
$line_break\
$character"""

palette = "monokai_pro"

[palettes.monokai_pro]
mp_bg = "#2d2a2e"
mp_fg = "#fcfcfa"
mp_gray = "#727072"
mp_green = "#a9dc76"
mp_yellow = "#ffd866"
mp_red = "#ff6188"
mp_purple = "#ab9df2"

continuation_prompt = '[󰄾 ](green) '

[directory]
style = "fg:mp_bg bg:mp_green"
before_repo_root_style = "fg:mp_bg bg:mp_green"
repo_root_style = "bold fg:mp_bg bg:mp_green"
read_only_style = "fg:mp_bg bg:mp_green"
format = '[ $path]($style)[$read_only ]($read_only_style)'
repo_root_format = '[ $before_root_path]($before_repo_root_style)[󰊢$repo_root]($repo_root_style)[$path]($style)[$read_only ]($read_only_style)'
home_symbol = ""
fish_style_pwd_dir_length = 2

[git_branch]
symbol = ""
style = "fg:mp_bg bg:mp_yellow"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:mp_bg bg:mp_yellow"
format = '[($all_status$ahead_behind )]($style)'

[c]
symbol = " "
style = "fg:mp_bg bg:mp_red"
format = '[ $symbol( $version) ]($style)'

[rust]
symbol = ""
style = "fg:mp_bg bg:mp_red"
format = '[ $symbol( $version) ]($style)'

[golang]
symbol = ""
style = "fg:mp_bg bg:mp_red"
format = '[ $symbol( $version) ]($style)'

[nodejs]
detect_extensions = []
symbol = ""
style = "fg:mp_bg bg:mp_red"
format = '[ $symbol( $version) ]($style)'

[php]
symbol = ""
style = "fg:mp_bg bg:mp_red"
format = '[ $symbol( $version) ]($style)'

[java]
symbol = " "
style = "fg:mp_bg bg:mp_red"
format = '[ $symbol( $version) ]($style)'

[kotlin]
symbol = ""
style = "fg:mp_bg bg:mp_red"
format = '[ $symbol( $version) ]($style)'

[haskell]
symbol = ""
style = "fg:mp_bg bg:mp_red"
format = '[ $symbol( $version) ]($style)'

[python]
detect_extensions = []
symbol = ""
style = "fg:mp_bg bg:mp_red"
format = '[ $symbol( $version) ]($style)'

[docker_context]
symbol = " "
style = "fg:mp_bg bg:mp_purple"
format = '[ $symbol( $context) ]($style)'

[kubernetes]
disabled = false
style = "fg:mp_bg bg:mp_purple"
format = '[ $symbol$context( \($namespace\)) ]($style)'

[aws]
symbol = " "
style = "fg:mp_bg bg:mp_purple"
format = '[ $symbol$profile ]($style)'

[shlvl]
disabled = false
threshold = 2
style = "fg:mp_fg bg:mp_gray"
format = '[ zsh:$shlvl]($style)'

[time]
disabled = false
style = "bold fg:mp_fg bg:mp_gray"
format = '[ $time]($style)'

[fill]
symbol = " "

[cmd_duration]
min_time = 0 # always show, 0s for anything under a second
format = '[$duration](bold green)'

[character]
success_symbol = '[](bold green)'
error_symbol = '[](bold red)'
